<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a4d"/>
      <stop offset="100%" stop-color="#00122e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle gold accent bar at top -->
  <rect x="0" y="0" width="64" height="3" rx="1.5" fill="#FFD200" opacity="0.7"/>
  <!-- Southern Cross stars (white with soft glow) -->
  <!-- Alpha Crucis — largest, bottom centre -->
  <circle cx="36" cy="46" r="5.5" fill="white" filter="url(#glow)" opacity="0.95"/>
  <!-- Beta Crucis — left -->
  <circle cx="18" cy="32" r="4" fill="white" filter="url(#glow)" opacity="0.9"/>
  <!-- Gamma Crucis — top -->
  <circle cx="36" cy="18" r="3.5" fill="white" filter="url(#glow)" opacity="0.9"/>
  <!-- Delta Crucis — right -->
  <circle cx="50" cy="28" r="4" fill="white" filter="url(#glow)" opacity="0.9"/>
  <!-- Epsilon Crucis — small, inner -->
  <circle cx="46" cy="38" r="2" fill="white" filter="url(#glow)" opacity="0.75"/>
  <!-- Gold dot accent bottom-left -->
  <circle cx="14" cy="50" r="2.5" fill="#FFD200" opacity="0.6"/>
</svg>
